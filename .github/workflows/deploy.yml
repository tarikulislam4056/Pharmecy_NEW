name: Deploy to cPanel via FTP (Data-Safe)

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Build & Upload Code to cPanel FTP (Preserve Live Data)
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install dependencies & Build (Code Only)
        run: |
          npm install
          npm run build
          cp api.php dist/ 2>/dev/null || true
          cp public/.htaccess dist/ 2>/dev/null || true
          cp db_config.example.php dist/ 2>/dev/null || true
          rm -f dist/erp_data_snapshot.json dist/erp_local_backup.json dist/database.sql dist/fresh_database.sql dist/db_config.php dist/.cpanel.yml

      - name: 🚀 Sync Code Files via FTP to cPanel (Never Delete or Overwrite Live Data)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_DIR || '/public_html/' }}
          FTP_PORT: ${{ secrets.FTP_PORT || '21' }}
        run: |
          # Clean accidental whitespace, CR/LF, or ftp:// prefixes from secrets
          CLEAN_SERVER="$(printf '%s' "$FTP_SERVER" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's|^ftps\?://||' -e 's|/.*$||')"
          CLEAN_USER="$(printf '%s' "$FTP_USERNAME" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          CLEAN_PASS="$(printf '%s' "$FTP_PASSWORD" | tr -d '\r\n')"
          CLEAN_DIR="$(printf '%s' "${FTP_DIR:-/public_html/}" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          CLEAN_PORT="$(printf '%s' "${FTP_PORT:-21}" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"

          if [ -z "$CLEAN_SERVER" ] || [ -z "$CLEAN_USER" ] || [ -z "$CLEAN_PASS" ]; then
            echo "⚠️ FTP Secrets are not configured in this repository (${{ github.repository }}):"
            [ -z "$CLEAN_SERVER" ] && echo "  - Missing: FTP_SERVER"
            [ -z "$CLEAN_USER" ] && echo "  - Missing: FTP_USERNAME"
            [ -z "$CLEAN_PASS" ] && echo "  - Missing: FTP_PASSWORD"
            if [ "${{ github.repository }}" != "tarikulislam4056/Pharmecy" ]; then
              echo "ℹ️ Skipping FTP deploy on mirror repository. Configure FTP secrets here or use TARGET_REPO_TOKEN to mirror to tarikulislam4056/Pharmecy."
              exit 0
            fi
            echo "❌ Please add FTP_SERVER, FTP_USERNAME, and FTP_PASSWORD under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          sudo apt-get update && sudo apt-get install -y lftp

          run_lftp_deploy() {
            local ssl_allow="$1"
            local ssl_protect="$2"
            local script_file="/tmp/cpanel_deploy.lftp"
            printf '%s\n' \
              "set ssl:verify-certificate no" \
              "set ftp:ssl-allow ${ssl_allow}" \
              "set ftp:ssl-force false" \
              "set ftp:ssl-protect-data ${ssl_protect}" \
              "set ftp:passive-mode true" \
              "set net:timeout 20" \
              "set net:max-retries 3" \
              "set net:reconnect-interval-base 5" \
              "mirror -R --verbose --exclude-glob erp_data_snapshot.json --exclude-glob erp_local_backup.json --exclude-glob database.sql --exclude-glob fresh_database.sql --exclude-glob db_config.php --exclude-glob '.cpanel.yml' --exclude-glob 'erp_storage/**' --exclude-glob 'dokanpro_erp_data/**' --exclude-glob 'backups/**' ./dist/ \"${CLEAN_DIR}\"" \
              "bye" > "$script_file"
            chmod 600 "$script_file"
            lftp -p "$CLEAN_PORT" -u "${CLEAN_USER},${CLEAN_PASS}" "$CLEAN_SERVER" -f "$script_file"
            local status=$?
            rm -f "$script_file"
            return $status
          }

          echo "🔐 Deploying to ${CLEAN_SERVER}:${CLEAN_PORT} -> ${CLEAN_DIR} (attempting Explicit FTPS/TLS first)..."
          if ! run_lftp_deploy "true" "true"; then
            echo "⚠️ FTPS attempt failed. Retrying with standard FTP (ssl-allow false)..."
            if ! run_lftp_deploy "false" "false"; then
              echo "❌ 530 Login authentication failed! Please check your cPanel FTP Secrets in GitHub Settings -> Secrets and variables -> Actions:"
              echo "  1. FTP_SERVER   = Hostname or IP only (e.g. ftp.yourdomain.com — no ftp:// or trailing slash)"
              echo "  2. FTP_USERNAME = Full FTP username (for cPanel sub-FTP accounts, MUST include @yourdomain.com)"
              echo "  3. FTP_PASSWORD = Exact FTP password from cPanel -> FTP Accounts"
              exit 1
            fi
          fi
          echo "✅ Successfully deployed code to cPanel!"
